name: Build DELIMOLD Native (Windows x86)

on:
  push:
    branches:
      - codex/delimold-python-native
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x86'
      - name: Install bundled app dependencies and packager
        run: |
          python -m pip install pip==24.3.1
          python -m pip install -r delimold-native/requirements-build.txt
      - name: Build the native desktop executable
        working-directory: delimold-native
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name DELIMOLD main.py
      - name: Assemble one shared TENDERLOIN package
        shell: pwsh
        working-directory: delimold-native
        run: |
          $root = "release/TENDERLOIN"
          New-Item -ItemType Directory -Force -Path "$root/App" | Out-Null
          Copy-Item -Recurse -Force "dist/DELIMOLD/*" "$root/App/"
          Copy-Item "config.master.example.json" "$root/App/config.json"
          if (Test-Path "seed/catalog.js") {
            New-Item -ItemType Directory -Force -Path "$root/App/seed" | Out-Null
            Copy-Item "seed/catalog.js" "$root/App/seed/catalog.js"
          }
          @'
          @echo off
          setlocal
          pushd "%~dp0"
          if errorlevel 1 goto share_error
          if not exist "App\DELIMOLD.exe" (
            echo DELIMOLD.exe tidak ditemukan di folder App.
            set "APP_EXIT=1"
            goto launch_error
          )
          echo Membuka DELIMOLD dari TENDERLOIN...
          start /wait "" "App\DELIMOLD.exe"
          set "APP_EXIT=%ERRORLEVEL%"
          if not "%APP_EXIT%"=="0" goto launch_error
          popd
          endlocal
          exit /b 0
          :launch_error
          echo DELIMOLD gagal dibuka atau berhenti dengan kode %APP_EXIT%.
          echo Log jika tersedia: %LOCALAPPDATA%\DELIMOLD\startup.log
          if exist "%LOCALAPPDATA%\DELIMOLD\startup.log" type "%LOCALAPPDATA%\DELIMOLD\startup.log"
          pause
          popd
          endlocal & exit /b 1
          :share_error
          echo Folder share TENDERLOIN tidak bisa diakses.
          pause
          endlocal & exit /b 1
          '@ | Set-Content -Encoding ASCII "$root/Buka-DELIMOLD.bat"
          @'
          @echo off
          setlocal
          pushd "%~dp0"
          if errorlevel 1 goto share_error
          if not exist "App\DELIMOLD.exe" (
            echo DELIMOLD.exe tidak ditemukan di folder App.
            set "APP_EXIT=1"
            goto launch_error
          )
          echo Menghubungkan Engineer ke DELIMOLD TENDERLOIN...
          start /wait "" "App\DELIMOLD.exe" --client
          set "APP_EXIT=%ERRORLEVEL%"
          if not "%APP_EXIT%"=="0" goto launch_error
          popd
          endlocal
          exit /b 0
          :launch_error
          echo DELIMOLD gagal dibuka atau berhenti dengan kode %APP_EXIT%.
          echo Log jika tersedia: %LOCALAPPDATA%\DELIMOLD\startup.log
          if exist "%LOCALAPPDATA%\DELIMOLD\startup.log" type "%LOCALAPPDATA%\DELIMOLD\startup.log"
          pause
          popd
          endlocal & exit /b 1
          :share_error
          echo Folder share TENDERLOIN tidak bisa diakses.
          pause
          endlocal & exit /b 1
          '@ | Set-Content -Encoding ASCII "$root/Buka-Engineer.bat"
          @'
          @echo off
          setlocal
          pushd "%~dp0"
          if errorlevel 1 goto share_error
          if not exist "App\DELIMOLD.exe" (
            echo DELIMOLD.exe tidak ditemukan di folder App.
            set "APP_EXIT=1"
            goto launch_error
          )
          echo Membuka pengaturan lokasi database dan SALAK...
          start /wait "" "App\DELIMOLD.exe" --configure
          set "APP_EXIT=%ERRORLEVEL%"
          if not "%APP_EXIT%"=="0" goto launch_error
          popd
          endlocal
          exit /b 0
          :launch_error
          echo Pengaturan DELIMOLD gagal dibuka atau berhenti dengan kode %APP_EXIT%.
          echo Log jika tersedia: %LOCALAPPDATA%\DELIMOLD\startup.log
          if exist "%LOCALAPPDATA%\DELIMOLD\startup.log" type "%LOCALAPPDATA%\DELIMOLD\startup.log"
          pause
          popd
          endlocal & exit /b 1
          :share_error
          echo Folder share TENDERLOIN tidak bisa diakses.
          pause
          endlocal & exit /b 1
          '@ | Set-Content -Encoding ASCII "$root/Atur-Lokasi-DELIMOLD.bat"
          Copy-Item "BACA-DULU-INDONESIA.txt" "release/BACA-DULU.txt"
          Compress-Archive -Path "release/*" -DestinationPath "DELIMOLD-Native-Python-Windows-x86.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DELIMOLD-Native-Python-Windows-x86
          path: delimold-native/DELIMOLD-Native-Python-Windows-x86.zip
          if-no-files-found: error
