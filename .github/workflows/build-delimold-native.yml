name: Build DELIMOLD Native (Windows x86)

on:
  push:
    branches:
      - codex/delimold-python-native
  workflow_dispatch:

jobs:
  windows-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x86'
      - name: Install bundled app dependencies and packager
        run: |
          python -m pip install pip==24.3.1
          python -m pip install -r delimold-native/requirements-build.txt
      - name: Build the native desktop executable
        working-directory: delimold-native
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name DELIMOLD main.py
      - name: Assemble no-install role folders
        shell: pwsh
        working-directory: delimold-native
        run: |
          $root = "release"
          foreach ($role in @("TENDERLOIN", "ENGINEER", "SALAK")) {
            New-Item -ItemType Directory -Force -Path "$root/$role/App" | Out-Null
            Copy-Item -Recurse -Force "dist/DELIMOLD/*" "$root/$role/App/"
          }
          Copy-Item "config.master.example.json" "$root/TENDERLOIN/App/config.json"
          Copy-Item "config.client.example.json" "$root/ENGINEER/App/config.json"
          Copy-Item "config.viewer.example.json" "$root/SALAK/App/config.json"
          if (Test-Path "seed/catalog.js") {
            New-Item -ItemType Directory -Force -Path "$root/TENDERLOIN/App/seed" | Out-Null
            Copy-Item "seed/catalog.js" "$root/TENDERLOIN/App/seed/catalog.js"
          }
          New-Item -ItemType Directory -Force -Path "$root/TENDERLOIN/App/Database" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/SALAK/App/published-python" | Out-Null
          Copy-Item "BACA-DULU-INDONESIA.txt" "$root/BACA-DULU.txt"
          Compress-Archive -Path "$root/*" -DestinationPath "DELIMOLD-Native-Python-Windows-x86.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DELIMOLD-Native-Python-Windows-x86
          path: delimold-native/DELIMOLD-Native-Python-Windows-x86.zip
          if-no-files-found: error
