name: Build DELIMOLD Native (Windows x86)

on:
  push:
    branches:
      - codex/delimold-python-native
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x86'
      - name: Install bundled app dependencies and packager
        run: |
          python -m pip install pip==24.3.1
          python -m pip install -r delimold-native/requirements-build.txt
      - name: Build the native desktop executable
        working-directory: delimold-native
        run: python -m PyInstaller --noconfirm --clean --onedir --contents-directory RUNTIME --paths . --windowed --name DELIMOLD app/main.py
      - name: Assemble direct-launch TENDERLOIN package without BAT files
        shell: pwsh
        working-directory: delimold-native
        run: |
          $root = "release/TENDERLOIN"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/APLIKASI" | Out-Null
          $databaseRoot = "$root/DATABASE"
          New-Item -ItemType Directory -Force -Path $databaseRoot | Out-Null
          Copy-Item -Recurse -Force "DATABASE/*" $databaseRoot
          Copy-Item "dist/DELIMOLD/DELIMOLD.exe" "$root/APLIKASI/DELIMOLD.exe"
          Copy-Item -Recurse -Force "dist/DELIMOLD/RUNTIME" "$root/APLIKASI/RUNTIME"
          Copy-Item -Recurse -Force "app" "$root/APLIKASI/app"
          Copy-Item "config.master.example.json" "$root/APLIKASI/config.json"
          if (Test-Path "app/data/seed/catalog.json") {
            New-Item -ItemType Directory -Force -Path "$root/APLIKASI/app/data/seed" | Out-Null
            Copy-Item "app/data/seed/catalog.json" "$root/APLIKASI/app/data/seed/catalog.json"
          }
          Copy-Item "BACA-DULU-INDONESIA.txt" "release/BACA-DULU.txt"
          Compress-Archive -Path "release/*" -DestinationPath "DELIMOLD-Native-Python-Windows-x86.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DELIMOLD-Native-Python-Windows-x86
          path: delimold-native/DELIMOLD-Native-Python-Windows-x86.zip
          if-no-files-found: error
